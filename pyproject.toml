[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "caption-with-intention"
version = "0.1.0"
description = "Caption With Intention — Open-Source Automation MVP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ffmpeg-python>=0.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "whisper>=20231117",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
]
gpu = [
    "torch>=2.0",
    "torchaudio>=2.0",
]
diarize = [
    "diarize>=3.0",
]
diarization = [
    "pyannote.audio>=3.0",
]

[tool.setuptools.packages.find]
include = ["engine.*", "apps.*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
