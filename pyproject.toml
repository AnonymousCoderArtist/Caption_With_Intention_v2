[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-with-intention"
version = "0.1.0"
description = "Caption With Intention — Open-Source Automation MVP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
]
asr = [
    "faster-whisper>=1.0",
]
diarization = [
    "pyannote.audio>=3.0",
    "silero-vad>=0.3",
]
gpu = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.40",
]

[tool.ruff.lint]
# Codebase convention is Optional[...] annotations
ignore = ["UP045"]

[tool.setuptools.packages.find]
include = ["engine.*", "apps.*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
